# Default values for trivy-operator-collector.
# This is a YAML-formatted file.

image:
  repository: ghcr.io/starttoaster/trivy-operator-explorer-collector
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  # Set to 'debug' for more logs
  log_level: 'info'

  # Required: the name used as the S3 key namespace for this cluster's reports.
  clusterName: ''

  # How often to read the cluster's reports and write them to S3.
  syncInterval: '5m'

# S3 configuration. The collector writes this cluster's report bundle here.
# Credentials are resolved via the standard AWS credential chain; use
# serviceAccount.annotations for IRSA.
s3:
  # Required: the bucket to write to.
  bucket: ''
  # Optional key prefix within the bucket.
  prefix: ''
  # Optional region. If empty, the AWS SDK default resolution is used.
  region: ''
  # Optional S3 endpoint URL (scheme included), for S3-compatible stores such as
  # MinIO or Garage, e.g. http://garage.garage.svc.cluster.local:3900. If empty,
  # the AWS SDK default resolution is used (including AWS_ENDPOINT_URL_S3).
  endpoint: ''
  # Address buckets as <endpoint>/<bucket>/<key> instead of
  # <bucket>.<endpoint>/<key>. Most self-hosted S3-compatible stores need this
  # unless wildcard DNS is set up for bucket hostnames. Leave false for AWS S3.
  usePathStyle: false

# Extra environment variables to add to the collector container (e.g. static AWS
# credentials when not using IRSA). For S3-compatible stores that reject the
# AWS SDK's default request checksums you can also set, optionally:
#   - name: AWS_REQUEST_CHECKSUM_CALCULATION
#     value: when_required
#   - name: AWS_RESPONSE_CHECKSUM_VALIDATION
#     value: when_required
extraEnv: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account (e.g. IRSA role ARN)
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 30000
  fsGroup: 2000
  runAsNonRoot: true

securityContext:
  capabilities:
    drop:
      - ALL
  runAsUser: 10001
  runAsGroup: 30000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

resources:
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
