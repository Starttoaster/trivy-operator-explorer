apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trivy-operator-collector.fullname" . }}
  labels:
    {{- include "trivy-operator-collector.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trivy-operator-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "trivy-operator-collector.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trivy-operator-collector.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TRIVY_OPERATOR_COLLECTOR_LOG_LEVEL
              value: '{{ .Values.config.log_level }}'
            - name: TRIVY_OPERATOR_COLLECTOR_CLUSTER_NAME
              value: '{{ required "config.clusterName is required" .Values.config.clusterName }}'
            - name: TRIVY_OPERATOR_COLLECTOR_S3_BUCKET
              value: '{{ required "s3.bucket is required" .Values.s3.bucket }}'
            - name: TRIVY_OPERATOR_COLLECTOR_S3_PREFIX
              value: '{{ .Values.s3.prefix }}'
            - name: TRIVY_OPERATOR_COLLECTOR_S3_REGION
              value: '{{ .Values.s3.region }}'
            - name: TRIVY_OPERATOR_COLLECTOR_SYNC_INTERVAL
              value: '{{ .Values.config.syncInterval }}'
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
