apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "server.fullname" . }}-api
  labels:
    {{- include "server.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            - name: TRIVY_API_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: TRIVY_API_LISTEN_ADDR
              value: ":{{ .Values.api.service.port }}"
            {{- include "server.dbDsn" . | nindent 12 }}
            {{- if .Values.tls.secretName }}
            - name: TRIVY_API_TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TRIVY_API_TLS_KEY_FILE
              value: /tls/tls.key
            - name: TRIVY_API_TLS_CA_FILE
              value: /tls/ca.crt
            {{- end }}
          {{- if .Values.tls.secretName }}
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: https
              {{- if .Values.tls.secretName }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: https
              {{- if .Values.tls.secretName }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if .Values.tls.secretName }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
