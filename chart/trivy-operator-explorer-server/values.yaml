frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/starttoaster/trivy-operator-explorer
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

api:
  replicaCount: 1
  image:
    repository: ghcr.io/starttoaster/trivy-operator-explorer-api
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 8443
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

database:
  # Postgres connection string used by both API and Frontend
  dsn: ""
  # Reference an existing secret instead of embedding the DSN in values
  existingSecret: ""
  existingSecretKey: "dsn"

tls:
  # Secret containing ca.crt, tls.crt, tls.key for the API mTLS server
  secretName: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  logLevel: "info"

podAnnotations: {}

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 30000
  fsGroup: 2000
  runAsNonRoot: true

securityContext:
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

nodeSelector: {}
tolerations: []
affinity: {}
